<!DOCTYPE html>
<html lang="en">

<!--
Catch-all for every URL that no longer exists. GitHub Pages serves this file for any
unmatched path on the whole domain, so one file covers all of them at once:
  - /bio.html and /50040-nlp.html   (removed in the 2026 restructure; course page moved
                                     to /courses/50040-nlp.html)
  - /test.html
  - /blog/**                        (removed back in 2021, still 404ing until now)
  - anything mistyped in the future

The redirect target MUST be the absolute "/" and not "./index.html": the browser keeps
the original path in the address bar, so a relative target would resolve back into the
missing directory (e.g. /blog/tags/nlp/index.html) and loop.
-->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=/">

  <title>Page not found — Wenxuan Zhang</title>
  <meta name="robots" content="noindex,follow">
  <link rel="stylesheet" href="/styles.css">
  <link href='https://fonts.googleapis.com/css?family=PT+Serif:400,700,400italic' rel='stylesheet' type='text/css'>
</head>

<body>

<div class="container">
<main>
  <p>This page has moved. Taking you to the <a href="/">homepage</a>&nbsp;…</p>
</main>
</div>

</body>

</html>
